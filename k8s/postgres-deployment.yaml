apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: geo-dispatch-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: geo_dispatch
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: geo-dispatch-prod
spec:
  selector:
    app: postgres
  ports:
    - port: 5432